<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universidad Nacional de La Matanza - Campus Isometrico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; overflow: auto; font-family: "Segoe UI", sans-serif; min-height: 100vh; }
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: linear-gradient(135deg, #1a4a1a 0%, #2d7a2d 60%, #1a4a1a 100%);
      color: #fff; padding: 10px 24px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    #header .logo-circle {
      width: 42px; height: 42px; border: 3px solid #7fff7f; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #7fff7f; flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 1.3; }
    #header p { font-size: 11px; opacity: .75; margin-top: 2px; }
    #controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    #controls button {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35);
      color: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer;
      font-size: 13px; transition: background .2s;
    }
    #controls button:hover { background: rgba(255,255,255,.3); }
    #zoom-label { font-size: 13px; color: #afffaf; min-width: 42px; text-align: center; }
    #scene-container { padding-top: 66px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    #scene-wrapper { transform-origin: top center; transition: transform .25s ease; position: relative; }
    #scene { position: relative; width: 1340px; height: 1520px; background: #ffffff; }
    .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
    .student { position: absolute; width: 22px; height: 38px; cursor: default; }
    @keyframes walkBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .student.walking { animation: walkBob 0.55s ease-in-out infinite; }
    .student.sitting { bottom: 0; }
    #legend {
      position: fixed; bottom: 16px; right: 16px; background: rgba(0,0,0,.78);
      color: #fff; border-radius: 10px; padding: 12px 16px; font-size: 12px;
      line-height: 1.9; z-index: 9998; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.15); min-width: 210px;
    }
  </style>
</head>
<body>
<div id="header">
  <div class="logo-circle">U</div>
  <div>
    <h1>Universidad Nacional de La Matanza</h1>
    <p>Campus Virtual - Vista Isometrica 3D</p>
  </div>
  <div id="controls">
    <button onclick="zoom(-0.1)">-</button>
    <span id="zoom-label">100%</span>
    <button onclick="zoom(+0.1)">+</button>
    <button onclick="resetZoom()">Reset</button>
  </div>
</div>

<script>
  let currentScale = 1.0;
  const wrapper = document.getElementById('scene-wrapper');
  const label   = document.getElementById('zoom-label');
  function zoom(delta) {
    currentScale = Math.max(0.3, Math.min(2.0, currentScale + delta));
    applyZoom();
  }
  function resetZoom() { currentScale = 1.0; applyZoom(); }
  function applyZoom() {
    wrapper.style.transform = `scale(${currentScale})`;
    label.textContent = Math.round(currentScale * 100) + '%';
  }
  document.getElementById('scene-container').addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 0.05 : -0.05); }
  }, { passive: false });
  window.addEventListener('load', () => {
    const vw = window.innerWidth;
    if (vw < 1380) { currentScale = (vw - 40) / 1340; applyZoom(); }
  });
</script>
