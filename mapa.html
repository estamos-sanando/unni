<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UNLaM · Campus Map</title>
<meta name="description" content="Mapa isométrico 3D del Campus UNLaM"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1a0e;}
  #c{display:block;width:100%;height:100%;}

  /* ── HUD ── */
  #hud{
    position:fixed;top:0;left:0;right:0;height:48px;
    background:rgba(8,18,9,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;gap:12px;padding:0 18px;
    z-index:100;user-select:none;
  }
  .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#2a4a1a,#4a8030);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;}
  .hud-title{font-family:system-ui,sans-serif;font-size:14px;font-weight:700;color:#e8f0e0;}
  .hud-sub{font-size:11px;color:rgba(180,210,180,.55);}
  .hud-sep{width:1px;height:22px;background:rgba(255,255,255,.08);flex-shrink:0;}
  .hud-btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    color:rgba(200,230,200,.8);border-radius:7px;padding:5px 12px;
    font-size:11px;cursor:pointer;font-family:inherit;
    transition:all .15s;white-space:nowrap;
  }
  .hud-btn:hover{background:rgba(255,255,255,.12);color:#e8f0e0;}
  .hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .hud-hint{font-size:10px;color:rgba(150,200,150,.45);font-family:system-ui,sans-serif;}

  /* ── LOADING ── */
  #loading{
    position:fixed;inset:0;background:#0d1a0e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:999;transition:opacity .6s;
  }
  #loading.done{opacity:0;pointer-events:none;}
  .ld-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#2a4a1a,#4a8030);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff;margin-bottom:20px;box-shadow:0 8px 32px rgba(60,120,40,.3);}
  .ld-title{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;color:#e8f0e0;margin-bottom:6px;}
  .ld-sub{font-size:12px;color:rgba(150,200,150,.5);}
  .ld-bar{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:24px;overflow:hidden;}
  .ld-fill{height:100%;background:linear-gradient(90deg,#4a8030,#7acc50);border-radius:2px;animation:ldAnim 1.2s ease-in-out forwards;}
  @keyframes ldAnim{from{width:0}to{width:100%}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="ld-logo">U</div>
  <div class="ld-title">UNLaM Campus</div>
  <div class="ld-sub">Cargando mapa 3D…</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="logo">U</div>
  <div>
    <div class="hud-title">UNLaM · Campus Map</div>
    <div class="hud-sub">Mapa Isométrico 3D</div>
  </div>
  <div class="hud-sep"></div>
  <button class="hud-btn" id="btn-iso">◆ Isométrico</button>
  <button class="hud-btn" id="btn-top">▲ Superior</button>
  <button class="hud-btn" id="btn-reset">⟳ Reset</button>
  <div class="hud-right">
    <span class="hud-hint">🖱 Arrastrar: rotar · Rueda: zoom · Clic der: mover</span>
  </div>
</div>

<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const GRID   = 20;       // 20 × 20 tiles
const TILE   = 2.0;      // 2m per tile
const GAP    = 0.035;    // gap between tiles
const H      = 0.14;     // tile height
const TOTAL  = GRID * TILE;

// ═══════════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// ═══════════════════════════════════════════════════════════
//  SCENE
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1a0e);
scene.fog = new THREE.FogExp2(0x0d1a0e, 0.006);

// ═══════════════════════════════════════════════════════════
//  CAMERA  (Orthographic · True Isometric)
// ═══════════════════════════════════════════════════════════
const CAM_SIZE = 38;
let asp = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -CAM_SIZE*asp, CAM_SIZE*asp, CAM_SIZE, -CAM_SIZE, -500, 1000
);

function isoView() {
  const phi = Math.atan(1/Math.sqrt(2));
  const dist = 120;
  camera.position.set(
    dist * Math.cos(phi) * Math.sin(Math.PI/4),
    dist * Math.sin(phi),
    dist * Math.cos(phi) * Math.cos(Math.PI/4)
  );
  camera.lookAt(0, 0, 0);
  controls?.target.set(0,0,0);
  controls?.update();
}

// ═══════════════════════════════════════════════════════════
//  ORBIT CONTROLS
// ═══════════════════════════════════════════════════════════
const controls = new OrbitControls(camera, canvas);
controls.enableDamping    = true;
controls.dampingFactor    = 0.055;
controls.screenSpacePanning = true;
controls.minZoom = 0.2; controls.maxZoom = 7;
controls.maxPolarAngle = Math.PI * 0.5;
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN,
};
isoView();

// ═══════════════════════════════════════════════════════════
//  LIGHTING
// ═══════════════════════════════════════════════════════════
// Ambient
scene.add(new THREE.AmbientLight(0xd0dce8, 0.55));

// Sun (main directional)
const sun = new THREE.DirectionalLight(0xfff4d8, 1.7);
sun.position.set(-55, 110, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left:-70, right:70, top:70, bottom:-70, near:.1, far:350 });
sun.shadow.bias   = -0.0004;
sun.shadow.radius = 3;
scene.add(sun);

// Fill (cool, opposite side)
const fill = new THREE.DirectionalLight(0xc0d0e0, 0.25);
fill.position.set(60, 40, -60);
scene.add(fill);

// Hemisphere
scene.add(new THREE.HemisphereLight(0xa8c0a0, 0x506040, 0.3));

// ═══════════════════════════════════════════════════════════
//  MATERIALS
// ═══════════════════════════════════════════════════════════
const MAT = {
  tile:     new THREE.MeshLambertMaterial({ color: 0xd2cac0 }),
  platform: new THREE.MeshLambertMaterial({ color: 0xa8a098 }),
  curb:     new THREE.MeshLambertMaterial({ color: 0x909088 }),
  joint:    new THREE.MeshLambertMaterial({ color: 0xbcb4aa }),
};

// ═══════════════════════════════════════════════════════════
//  BASE PLATFORM  (the raised slab the tiles sit on)
// ═══════════════════════════════════════════════════════════
const platformH = 0.42;
const platGeo = new THREE.BoxGeometry(TOTAL + 0.8, platformH, TOTAL + 0.8);
platGeo.translate(0, -platformH/2, 0);
const platform = new THREE.Mesh(platGeo, MAT.platform);
platform.receiveShadow = true;
scene.add(platform);

// ═══════════════════════════════════════════════════════════
//  PERIMETER CURB
// ═══════════════════════════════════════════════════════════
const curbH = 0.22, curbW = 0.25;
[
  // N, S, E, W
  [0, 0, -(TOTAL/2 + curbW/2),   TOTAL + curbW*2, curbH, curbW],
  [0, 0,  (TOTAL/2 + curbW/2),   TOTAL + curbW*2, curbH, curbW],
  [-(TOTAL/2 + curbW/2), 0, 0,   curbW, curbH, TOTAL],
  [ (TOTAL/2 + curbW/2), 0, 0,   curbW, curbH, TOTAL],
].forEach(([x,y,z,w,h,d]) => {
  const geo = new THREE.BoxGeometry(w,h,d);
  geo.translate(0, h/2, 0);
  const m = new THREE.Mesh(geo, MAT.curb);
  m.position.set(x,y,z);
  m.receiveShadow = true;
  m.castShadow    = true;
  scene.add(m);
});

// ═══════════════════════════════════════════════════════════
//  CONCRETE TILES  (InstancedMesh — 400 tiles)
// ═══════════════════════════════════════════════════════════
const tileSize = TILE - GAP;
const tileGeo  = new THREE.BoxGeometry(tileSize, H, tileSize);
tileGeo.translate(0, H/2, 0);

const tileMesh = new THREE.InstancedMesh(tileGeo, MAT.tile, GRID * GRID);
tileMesh.castShadow    = true;
tileMesh.receiveShadow = true;

const dummy = new THREE.Object3D();
const seededRng = (() => { let s=12345; return()=>{ s=Math.imul(s,1664525)+1013904223|0; return(s>>>0)/4294967296; }; })();

for(let r=0; r<GRID; r++) {
  for(let c=0; c<GRID; c++) {
    const idx = r*GRID+c;
    dummy.position.set(
      c*TILE - TOTAL/2 + TILE/2,
      0,
      r*TILE - TOTAL/2 + TILE/2
    );
    // Subtle height micro-variation for realism
    dummy.position.y = (seededRng()-0.5)*0.005;
    dummy.updateMatrix();
    tileMesh.setMatrixAt(idx, dummy.matrix);

    // Very subtle tile-to-tile color variation
    const v = 1 + (seededRng()-0.5)*0.04;
    const base = new THREE.Color(0xd2cac0);
    tileMesh.setColorAt(idx, base.multiplyScalar(v));
  }
}
tileMesh.instanceMatrix.needsUpdate = true;
if(tileMesh.instanceColor) tileMesh.instanceColor.needsUpdate = true;
scene.add(tileMesh);

// ═══════════════════════════════════════════════════════════
//  JOINT LINES (grid lines between tiles, on the surface)
// ═══════════════════════════════════════════════════════════
const jointH   = 0.004;
const jointW   = 0.028;
const jointMat = MAT.joint;

// Horizontal joints (parallel to X)
for(let r=1; r<GRID; r++) {
  const z = r*TILE - TOTAL/2;
  const geo = new THREE.BoxGeometry(TOTAL, jointH, jointW);
  geo.translate(0, H + jointH/2, 0);
  const m = new THREE.Mesh(geo, jointMat);
  m.position.set(0, 0, z);
  m.receiveShadow = false;
  scene.add(m);
}
// Vertical joints (parallel to Z)
for(let c=1; c<GRID; c++) {
  const x = c*TILE - TOTAL/2;
  const geo = new THREE.BoxGeometry(jointW, jointH, TOTAL);
  geo.translate(0, H + jointH/2, 0);
  const m = new THREE.Mesh(geo, jointMat);
  m.position.set(x, 0, 0);
  scene.add(m);
}

// ═══════════════════════════════════════════════════════════
//  GRID HELPER (faint isometric grid lines, optional)
// ═══════════════════════════════════════════════════════════
const gridHelper = new THREE.GridHelper(TOTAL, GRID, 0x334433, 0x223322);
gridHelper.position.y = H + 0.015;
gridHelper.material.opacity   = 0.18;
gridHelper.material.transparent= true;
scene.add(gridHelper);

// ═══════════════════════════════════════════════════════════
//  HUD BUTTONS
// ═══════════════════════════════════════════════════════════
document.getElementById('btn-iso').addEventListener('click', () => {
  isoView();
});
document.getElementById('btn-top').addEventListener('click', () => {
  camera.position.set(0, 180, 0.001);
  camera.lookAt(0,0,0);
  controls.target.set(0,0,0);
  controls.update();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  isoView();
  camera.left = -CAM_SIZE*asp; camera.right = CAM_SIZE*asp;
  camera.top = CAM_SIZE; camera.bottom = -CAM_SIZE;
  camera.zoom = 1;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  asp = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  camera.left   = -CAM_SIZE*asp;
  camera.right  =  CAM_SIZE*asp;
  camera.top    =  CAM_SIZE;
  camera.bottom = -CAM_SIZE;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════════════════════
//  ANIMATE
// ═══════════════════════════════════════════════════════════
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();

// ─── Remove loading screen ────────────────────────────────
setTimeout(() => {
  document.getElementById('loading').classList.add('done');
  setTimeout(() => document.getElementById('loading').remove(), 700);
}, 900);
</script>
</body>
</html>
